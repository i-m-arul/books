---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — {{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f1ea; --text:#1a1714; --accent:#7a1e1e; --muted:#6b6358;
  --border:#cfc7b8; --nav-bg:#ebe6db; --link:#7a1e1e;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1410;--text:#e8ddd0;--accent:#c9656a;--muted:#9e8c7a;
        --border:#2e2520;--nav-bg:#211c17;--link:#c9656a;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Newsreader',Georgia,serif;background:var(--bg);
     color:var(--text);line-height:1.85;font-size:1.05rem;}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{font-family:'Fraunces',Georgia,serif}
.site-header{background:var(--nav-bg);border-bottom:1px solid var(--border);
  padding:0.75rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.site-header .brand{font-family:'Fraunces',serif;font-size:1rem;font-weight:600;
  color:var(--accent);letter-spacing:0.01em;text-decoration:none}
.site-header .brand:hover{text-decoration:none;opacity:0.85}
.site-header nav{margin-left:auto;font-family:'Fraunces',serif;font-size:0.85rem;
  display:flex;gap:1.4rem}
.site-header nav a{color:var(--muted)}
.site-header nav a:hover{color:var(--accent);text-decoration:none}
.container{max-width:700px;margin:0 auto;padding:2.5rem 1.5rem}
h1{font-size:1.6rem;margin-bottom:0.3rem;line-height:1.2}
h2{font-size:1.25rem;margin:2rem 0 0.8rem;color:var(--accent)}
.subtitle{color:var(--muted);font-style:italic;font-size:0.95rem;margin-bottom:2rem}
footer{text-align:center;padding:2rem 1.5rem;color:var(--muted);
  font-size:0.82rem;border-top:1px solid var(--border);margin-top:3rem;
  font-family:'Newsreader',serif;font-style:italic}
</style>
</head>
<body>
<header class="site-header">
  <a href="{{ site.baseurl }}/" class="brand">The Fracture Novels</a>
  <nav>
    <a href="{{ site.baseurl }}/31-10-84/">31.10.84</a>
    <a href="{{ site.baseurl }}/21-05-91/">21.05.91</a>
  </nav>
</header>
{{ content }}
<footer>
  <p style="font-family:'Fraunces',serif;font-size:1rem;font-weight:600;color:var(--text);margin-bottom:0.3rem">Arul Anand</p>
  <p style="font-style:italic;margin-bottom:0.5rem">Political fiction at the seam between history and imagination.</p>
  <p>&copy; Arul Anand. Free to read online &mdash; not for reproduction.</p>
</footer>
</body>
</html>
