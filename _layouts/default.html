---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — {{ site.title }}</title>
<style>
:root {
  --bg:#faf8f5; --text:#2c2416; --accent:#8b1a1a; --muted:#7a6a58;
  --border:#ddd4c4; --nav-bg:#f0ece4; --link:#8b1a1a;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1410;--text:#e8ddd0;--accent:#c9656a;--muted:#9e8c7a;
        --border:#2e2520;--nav-bg:#211c17;--link:#c9656a;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,"Times New Roman",serif;background:var(--bg);
     color:var(--text);line-height:1.85;font-size:1.05rem;}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.site-header{background:var(--nav-bg);border-bottom:1px solid var(--border);
  padding:0.8rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.site-header .brand{font-size:1.1rem;font-weight:bold;color:var(--accent);
  letter-spacing:0.03em;text-decoration:none}
.site-header .brand:hover{text-decoration:none;opacity:0.85}
.site-header nav{margin-left:auto;font-size:0.85rem;display:flex;gap:1.2rem}
.container{max-width:700px;margin:0 auto;padding:2.5rem 1.5rem}
h1{font-size:1.6rem;margin-bottom:0.3rem;line-height:1.25}
h2{font-size:1.25rem;margin:2rem 0 0.8rem;color:var(--accent)}
.subtitle{color:var(--muted);font-style:italic;font-size:0.95rem;margin-bottom:2rem}
footer{text-align:center;padding:2rem;color:var(--muted);
  font-size:0.8rem;border-top:1px solid var(--border);margin-top:3rem}
</style>
</head>
<body>
<header class="site-header">
  <a href="{{ site.baseurl }}/" class="brand">The Fracture Novels</a>
  <nav>
    <a href="{{ site.baseurl }}/31-10-84/">31.10.84</a>
    <a href="{{ site.baseurl }}/21-05-91/">21.05.91</a>
  </nav>
</header>
{{ content }}
<footer>
  <p>© Arul &mdash; Free to read, not for reproduction.</p>
</footer>
</body>
</html>
