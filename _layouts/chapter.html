---
layout: default
---
<style>
.chapter-header{padding:2rem 1.5rem 0;max-width:700px;margin:0 auto}
.breadcrumb{font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem}
.breadcrumb a{color:var(--muted)}
.chapter-title{font-size:1.5rem;line-height:1.25;margin-bottom:0.2rem}
.chapter-divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0}
.chapter-content p{margin:0 0 1.3em;text-align:justify;hyphens:auto}
.chapter-content > p:first-of-type::first-letter{
  font-size:3.2em;float:left;line-height:0.78;margin:0.08em 0.08em 0 0;
  color:var(--accent);font-weight:bold;}
.chapter-nav{display:flex;justify-content:space-between;align-items:flex-start;
  gap:1rem;border-top:1px solid var(--border);padding-top:1.5rem;margin-top:3rem;
  font-size:0.85rem}
.chapter-nav .nav-block{max-width:45%}
.chapter-nav .nav-label{color:var(--muted);display:block;margin-bottom:0.2rem;
  font-style:italic}
.chapter-nav a{font-weight:bold;color:var(--accent)}
.chapter-nav .nav-right{text-align:right}
@media(max-width:500px){
  .chapter-content > p:first-of-type::first-letter{font-size:2.5em}
  h1.chapter-title{font-size:1.2rem}
}
</style>
<div class="chapter-header">
  <div class="breadcrumb">
    <a href="{{ site.baseurl }}/">Home</a> &rsaquo;
    <a href="{{ site.baseurl }}/{{ page.book_slug }}/">{{ page.book_title }}</a>
  </div>
  <h1 class="chapter-title">{{ page.title }}</h1>
</div>
<div class="container">
  <hr class="chapter-divider">
  <div class="chapter-content">
    {{ content }}
  </div>
  <nav class="chapter-nav">
    <div class="nav-block nav-left">
      {% if page.prev_url != "" %}
      <span class="nav-label">&larr; Previous</span>
      <a href="{{ site.baseurl }}{{ page.prev_url }}">{{ page.prev_title }}</a>
      {% endif %}
    </div>
    <div class="nav-block nav-right">
      {% if page.next_url != "" %}
      <span class="nav-label">Next &rarr;</span>
      <a href="{{ site.baseurl }}{{ page.next_url }}">{{ page.next_title }}</a>
      {% endif %}
    </div>
  </nav>
</div>
